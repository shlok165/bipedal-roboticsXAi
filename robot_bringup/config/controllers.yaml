controller_manager:
  ros__parameters:
    update_rate: 100  

    bipedal_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


bipedal_controller:
  ros__parameters:
    # List all 6 joints that the controller will command
    joints:
      - left_hip_joint
      - left_knee_joint
      - left_ankle_joint
      - right_hip_joint
      - right_knee_joint
      - right_ankle_joint

    # Corrected the command interface typo
    command_interfaces:
      - position
      
    state_interfaces:
      - position
      - velocity
      
    constraints:
      goal_time: 0.5  
      stopped_velocity_tolerance: 0.01
      left_hip_joint:
        goal: 0.05 
      left_knee_joint:
        goal: 0.05 
      # Added goal constraint for the left ankle
      left_ankle_joint:
        goal: 0.05
      right_hip_joint:
        goal: 0.05 
      right_knee_joint:
        goal: 0.05
      # Added goal constraint for the right ankle
      right_ankle_joint:
        goal: 0.05

    gains:
      # PID gains for each joint
      left_hip_joint:   {p: 10.0, i: 0.0, d: 1.0}
      left_knee_joint:  {p: 10.0, i: 0.0, d: 1.0}
      left_ankle_joint: {p: 10.0, i: 0.0, d: 1.0} # Added gains for left ankle
      right_hip_joint:  {p: 10.0, i: 0.0, d: 1.0}
      right_knee_joint: {p: 10.0, i: 0.0, d: 1.0}
      right_ankle_joint: {p: 10.0, i: 0.0, d: 1.0} # Added gains for right ankle
